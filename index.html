<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Smart Greenhouse</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #000; color: #f5b301;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100%; overflow-x: hidden; }
  body { padding: 16px 14px 40px; max-width: 520px; margin: 0 auto; }

  /* ---------- Dual gauges ---------- */
  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .gauge-card {
    background: #0a0a0a; border: 1px solid #3a2c00;
    border-radius: 20px; padding: 16px 10px; text-align: center;
  }
  .gauge-wrap { position: relative; width: 130px; height: 130px; margin: 0 auto 10px; }
  .gauge-svg { transform: rotate(-90deg); }
  .gauge-bg { fill: none; stroke: #2a2000; stroke-width: 10; }
  .gauge-fg { fill: none; stroke: #f5b301; stroke-width: 10;
    stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  .gauge-center { position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center; }
  .gauge-val { font-size: 1.6rem; font-weight: 800; line-height: 1; color: #f5b301; }
  .gauge-lbl { font-size: 0.62rem; color: #f5b301; opacity: 0.65; margin-top: 3px;
    letter-spacing: 0.5px; text-transform: uppercase; }
  .gauge-target { font-size: 0.68rem; color: #f5b301; opacity: 0.7; margin-top: 4px; }
  .gauge-target b { color: #f5b301; opacity: 1; }

  /* ---------- Status row ---------- */
  .status-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .status-card { background: #0a0a0a; border: 1px solid #3a2c00; border-radius: 16px;
    padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .status-card.wide { grid-column: 1 / -1; }
  .status-card .l { font-size: 0.68rem; color: #f5b301; opacity: 0.65;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .status-card .row { display: flex; justify-content: space-between; align-items: center; }
  .status-card .v { font-size: 1.15rem; font-weight: 700; color: #f5b301; }
  .pill { padding: 4px 12px; border-radius: 20px; font-size: 0.72rem;
    font-weight: 700; letter-spacing: 0.4px; }
  .pill.on  { background: #f5b301; color: #000; }
  .pill.off { background: #2a2000; color: #8a6a00; }

  .power-detail { display: flex; justify-content: space-between; font-size: 0.72rem;
    color: #f5b301; opacity: 0.7;
    padding-top: 4px; border-top: 1px solid #2a2000; margin-top: 4px; }
  .power-detail span:last-child { color: #f5b301; font-weight: 600; opacity: 1; }

  /* ---------- Control card ---------- */
  .control-card { background: #0a0a0a; border: 1px solid #3a2c00; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; }
  .control-title { font-size: 0.9rem; font-weight: 700; color: #f5b301; margin-bottom: 12px; }
  .control-section {
    font-size: 0.7rem; color: #f5b301; opacity: 0.65;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid #2a2000;
  }
  .control-section:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .control-row label { font-size: 0.8rem; color: #f5b301; opacity: 0.8; }
  .control-row input { width: 90px; background: #000; border: 1px solid #3a2c00;
    border-radius: 8px; padding: 8px 10px; color: #f5b301;
    font-size: 0.9rem; font-weight: 700; text-align: center; outline: none; }
  .control-row input:focus { border-color: #f5b301; }
  .save-btn { width: 100%; padding: 12px; background: #f5b301; color: #000;
    border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; margin-top: 6px; }
  .save-btn:active { opacity: 0.8; }
  .save-msg { text-align: center; font-size: 0.75rem; color: #f5b301; margin-top: 8px; min-height: 16px; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; font-size: 0.78rem;
    font-weight: 600; color: #f5b301; background: #0a0a0a;
    border: 1px solid #3a2c00; cursor: pointer; }
  .tab.active { background: #f5b301; color: #000; border-color: #f5b301; }

  /* ---------- Charts ---------- */
  .chart-wrap { position: relative; background: #0a0a0a; border: 1px solid #3a2c00;
    border-radius: 18px; padding: 14px 8px 8px; height: 220px; margin-bottom: 12px; }
  .chart-wrap.power-chart { height: 180px; }
  .chart-tag { position: absolute; top: 10px; left: 14px; font-size: 0.72rem;
    font-weight: 700; color: #f5b301; z-index: 5; letter-spacing: 0.5px; }
  .chart-legend {
    position: absolute; top: 10px; right: 14px;
    display: flex; gap: 10px; font-size: 0.62rem; color: #f5b301; opacity: 0.75; z-index: 5;
  }
  .chart-legend .dot { display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  canvas { width: 100% !important; height: 100% !important; }

  /* ---------- Table ---------- */
  .table-box { background: #0a0a0a; border: 1px solid #3a2c00; border-radius: 16px;
    overflow: hidden; max-height: 380px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
  th, td { padding: 9px 8px; text-align: left;
    border-bottom: 1px solid #2a2000; color: #f5b301; }
  th { background: #000; font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.4px; color: #f5b301; opacity: 0.65;
    position: sticky; top: 0; z-index: 2; }
  tbody tr:nth-child(even) { background: #060600; }
  tbody tr:last-child td { border-bottom: none; }
  .badge { padding: 2px 7px; border-radius: 20px; font-size: 0.66rem; font-weight: 700; }
  .badge.on  { background: #f5b301; color: #000; }
  .badge.off { background: #2a2000; color: #8a6a00; }

  .refresh { text-align: center; font-size: 0.7rem; color: #f5b301;
    opacity: 0.55; margin-top: 14px; }
</style>
</head>
<body>

  <!-- Dual gauges -->
  <div class="gauges">
    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg class="gauge-svg" width="130" height="130" viewBox="0 0 130 130">
          <circle class="gauge-bg" cx="65" cy="65" r="55"></circle>
          <circle class="gauge-fg" id="gaugeHum" cx="65" cy="65" r="55"
                  stroke-dasharray="345.6" stroke-dashoffset="345.6"></circle>
        </svg>
        <div class="gauge-center">
          <div class="gauge-val" id="gaugeHumVal">--%</div>
          <div class="gauge-lbl">Humidity</div>
        </div>
      </div>
      <div class="gauge-target">Target: <b id="targetNote">52%</b></div>
    </div>

    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg class="gauge-svg" width="130" height="130" viewBox="0 0 130 130">
          <circle class="gauge-bg" cx="65" cy="65" r="55"></circle>
          <circle class="gauge-fg" id="gaugeTemp" cx="65" cy="65" r="55"
                  stroke-dasharray="345.6" stroke-dashoffset="345.6"></circle>
        </svg>
        <div class="gauge-center">
          <div class="gauge-val" id="gaugeTempVal">--°</div>
          <div class="gauge-lbl">Temp</div>
        </div>
      </div>
      <div class="gauge-target">Target: <b id="targetTempNote">27°C</b></div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <div class="status-card">
      <div class="l">💧 Humidifier</div>
      <div class="row">
        <div class="v" id="humStatusTxt">--</div>
        <span class="pill off" id="humPill">--</span>
      </div>
    </div>
    <div class="status-card">
      <div class="l">🌀 Fan</div>
      <div class="row">
        <div class="v" id="fanStatusTxt">--</div>
        <span class="pill off" id="fanPill">--</span>
      </div>
    </div>
    <div class="status-card wide">
      <div class="l">⚡ Total Power</div>
      <div class="row">
        <div class="v" id="powerNow">-- W</div>
        <div class="v" id="powerToday">-- kWh</div>
      </div>
      <div class="power-detail"><span>Humidifier</span><span id="pwrHum">-- W</span></div>
      <div class="power-detail"><span>Fan</span><span id="pwrFan">-- W</span></div>
      <div class="power-detail"><span>ESP32 + sensor</span><span id="pwrEsp">-- W</span></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="control-card">
    <div class="control-title">🎯 Controls</div>

    <div class="control-section">Humidity</div>
    <div class="control-row"><label>Target humidity (%)</label>
      <input type="number" id="inTarget" min="20" max="95" value="52"></div>
    <div class="control-row"><label>± Humidity band (%)</label>
      <input type="number" id="inBand" min="0" max="10" value="2"></div>
    <div class="control-row"><label>Fan ON above (%)</label>
      <input type="number" id="inFan" min="30" max="95" value="70"></div>

    <div class="control-section">Temperature</div>
    <div class="control-row"><label>Target temperature (°C)</label>
      <input type="number" id="inTargetTemp" min="10" max="40" value="27"></div>
    <div class="control-row"><label>± Temperature band (°C)</label>
      <input type="number" id="inTempBand" min="0" max="5" step="0.5" value="1"></div>
    <div class="control-row"><label>Cooler ON above (°C)</label>
      <input type="number" id="inCooler" min="10" max="40" value="32"></div>

    <button id="saveBtn" class="save-btn" onclick="saveTarget()">Save</button>
    <div class="save-msg" id="saveMsg"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-day="0">Today</button>
    <button class="tab" data-day="1">Yesterday</button>
    <button class="tab" data-day="2">2 Days Ago</button>
  </div>

  <!-- Humidity chart -->
  <div class="chart-wrap">
    <div class="chart-tag">HUMIDITY</div>
    <div class="chart-legend">
      <span><span class="dot" style="background:#f5b301"></span>Actual</span>
      <span><span class="dot" style="background:#f5b301;opacity:0.4"></span>Target</span>
    </div>
    <canvas id="chartHum"></canvas>
  </div>

  <!-- Temperature chart -->
  <div class="chart-wrap">
    <div class="chart-tag">TEMPERATURE</div>
    <div class="chart-legend">
      <span><span class="dot" style="background:#f5b301"></span>Actual</span>
      <span><span class="dot" style="background:#f5b301;opacity:0.4"></span>Target</span>
    </div>
    <canvas id="chartTemp"></canvas>
  </div>

  <!-- Power chart -->
  <div class="chart-wrap power-chart">
    <div class="chart-tag">POWER</div>
    <div class="chart-legend">
      <span><span class="dot" style="background:#f5b301"></span>Watts</span>
    </div>
    <canvas id="chartPower"></canvas>
  </div>

  <!-- Table -->
  <div class="table-box">
    <table>
      <thead>
        <tr><th>Time</th><th>Temp</th><th>Hum</th><th>Tgt</th><th>Humid.</th><th>Fan</th><th>Power</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="refresh" id="refreshed">Loading…</div>

<script>
/* ============================================================
   DEMO — all-yellow theme, settable targets, 3 charts
   ============================================================ */

const YELLOW = "#f5b301";
const PWR_HUMIDIFIER = 300, PWR_FAN = 25, PWR_ESP32 = 1.5;

let currentDay = 0;
let chartHum, chartTemp, chartPower;

let targetHumidity = 52, humidityBand = 2, fanOnHumidity = 70;
let targetTemp     = 27, tempBand     = 1, coolerOnTemp   = 32;

function generateDayData(dayOffset, tHum, tTemp) {
  const rows = [];
  const now = new Date();
  const samples = 8640;
  const endTime = new Date(now.getTime() - dayOffset * 86400000);

  for (let i = samples; i >= 0; i--) {
    const t = new Date(endTime.getTime() - i * 10000);
    if (t > now) continue;

    const hour = t.getHours() + t.getMinutes() / 60;

    const hum = tHum + 6 * Math.sin(hour / 3) + 3 * Math.sin(hour * 1.7) + (Math.random() - 0.5) * 1.5;
    const temp = tTemp + 4 * Math.sin((hour - 6) / 4) + 1.5 * Math.sin(hour * 2.1) + (Math.random() - 0.5) * 0.6;

    const humState = hum < tHum - 2 ? "ON" : "OFF";
    const fanState = (hum > fanOnHumidity || temp > coolerOnTemp) ? "ON" : "OFF";

    rows.push({
      date: t.toISOString().slice(0,10),
      time: t.toTimeString().slice(0,8),
      temp: +temp.toFixed(1),
      hum: +hum.toFixed(1),
      target: tHum,
      targetTemp: tTemp,
      humState,
      fanState
    });
  }
  return rows;
}

let DEMO_DATA = {
  0: generateDayData(0, targetHumidity, targetTemp),
  1: generateDayData(1, targetHumidity, targetTemp),
  2: generateDayData(2, targetHumidity, targetTemp)
};

/* ---------- Render ---------- */
function render() {
  const rows = DEMO_DATA[currentDay];
  const last = rows[rows.length - 1];
  const label = currentDay === 0 ? "Today" : currentDay === 1 ? "Yesterday" : `${currentDay} days ago`;

  const humPct = Math.max(0, Math.min(1, last.hum / 100));
  document.getElementById("gaugeHum").style.strokeDashoffset = 345.6 * (1 - humPct);
  document.getElementById("gaugeHumVal").textContent = last.hum.toFixed(0) + "%";
  document.getElementById("targetNote").textContent = targetHumidity + "%";

  const tempPct = Math.max(0, Math.min(1, (last.temp - 10) / 30));
  document.getElementById("gaugeTemp").style.strokeDashoffset = 345.6 * (1 - tempPct);
  document.getElementById("gaugeTempVal").textContent = last.temp.toFixed(1) + "°";
  document.getElementById("targetTempNote").textContent = targetTemp + "°C";

  const humOn = last.humState === "ON";
  document.getElementById("humStatusTxt").textContent = humOn ? "Running" : "Idle";
  const humPill = document.getElementById("humPill");
  humPill.textContent = last.humState;
  humPill.className = "pill " + (humOn ? "on" : "off");

  const fanOn = last.fanState === "ON";
  document.getElementById("fanStatusTxt").textContent = fanOn ? "Running" : "Idle";
  const fanPill = document.getElementById("fanPill");
  fanPill.textContent = last.fanState;
  fanPill.className = "pill " + (fanOn ? "on" : "off");

  const pwrHumNow = humOn ? PWR_HUMIDIFIER : 0;
  const pwrFanNow = fanOn ? PWR_FAN : 0;
  const pwrTotal  = pwrHumNow + pwrFanNow + PWR_ESP32;
  document.getElementById("powerNow").textContent = pwrTotal.toFixed(1) + " W";
  document.getElementById("pwrHum").textContent   = pwrHumNow + " W";
  document.getElementById("pwrFan").textContent   = pwrFanNow + " W";
  document.getElementById("pwrEsp").textContent   = PWR_ESP32 + " W";

  const dtHours = 10 / 3600;
  let energy = 0;
  rows.forEach(r => {
    const w = (r.humState === "ON" ? PWR_HUMIDIFIER : 0)
            + (r.fanState === "ON" ? PWR_FAN : 0) + PWR_ESP32;
    energy += w * dtHours;
  });
  document.getElementById("powerToday").textContent = energy.toFixed(2) + " kWh";

  document.getElementById("tbody").innerHTML = rows.slice(-100).reverse().map(r => {
    const w = (r.humState === "ON" ? PWR_HUMIDIFIER : 0)
            + (r.fanState === "ON" ? PWR_FAN : 0) + PWR_ESP32;
    return `<tr>
      <td>${r.time.slice(0,5)}</td>
      <td>${r.temp.toFixed(1)}</td>
      <td>${r.hum.toFixed(1)}</td>
      <td>${r.target}</td>
      <td><span class="badge ${r.humState === "ON" ? "on" : "off"}">${r.humState}</span></td>
      <td><span class="badge ${r.fanState === "ON" ? "on" : "off"}">${r.fanState}</span></td>
      <td>${w.toFixed(0)} W</td>
    </tr>`;
  }).join("");

  drawHumidityChart(rows.slice(-500));
  drawTempChart(rows.slice(-500));
  drawPowerChart(rows.slice(-500));

  document.getElementById("refreshed").textContent =
    `${label} · Updated ` + new Date().toLocaleTimeString();
}

/* ---------- Common plugins ---------- */
function makeGridPlugin(values) {
  return {
    id: "grid",
    beforeDatasetsDraw(c) {
      const { ctx, chartArea, scales } = c;
      ctx.save();
      ctx.strokeStyle = "rgba(245,179,1,0.18)";
      ctx.setLineDash([3, 6]); ctx.lineWidth = 1;
      values.forEach(v => {
        const py = scales.y.getPixelForValue(v);
        ctx.beginPath();
        ctx.moveTo(chartArea.left, py);
        ctx.lineTo(chartArea.right, py);
        ctx.stroke();
      });
      ctx.restore();
    }
  };
}

function makeEndDotPlugin() {
  return {
    id: "endDot",
    afterDatasetsDraw(c) {
      const { ctx, scales } = c;
      const x = scales.x.getPixelForValue(c.data.labels.length - 1);
      const y = scales.y.getPixelForValue(c.data.datasets[0].data.at(-1));
      ctx.save();
      ctx.fillStyle = YELLOW;
      ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
  };
}

/* ---------- Humidity chart ---------- */
function drawHumidityChart(rows) {
  const labels = rows.map(r => r.time.slice(0,5));
  const hum    = rows.map(r => r.hum);
  const target = rows.map(() => targetHumidity);

  if (chartHum) chartHum.destroy();

  chartHum = new Chart(document.getElementById("chartHum"), {
    type: "line",
    data: { labels, datasets: [
      { label: "Humidity", data: hum, borderColor: YELLOW,
        backgroundColor: "rgba(245,179,1,0.12)", fill: true, tension: 0.35,
        pointRadius: 0, borderWidth: 2.5 },
      { label: "Target", data: target, borderColor: YELLOW,
        pointRadius: 0, borderWidth: 1.4, borderDash: [5, 4], opacity: 0.5 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 18, right: 8, left: 0, bottom: 0 } },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: "#000", borderColor: YELLOW, borderWidth: 1,
          titleColor: YELLOW, bodyColor: YELLOW } },
      scales: {
        x: { grid: { display: false }, border: { color: "#3a2c00" },
          ticks: { color: YELLOW, maxTicksLimit: 4, font: { size: 9 } } },
        y: { min: 30, max: 80, grid: { display: false }, border: { display: false },
          ticks: { color: YELLOW, stepSize: 25, callback: v => v + "%", font: { size: 9 } } }
      }
    },
    plugins: [makeGridPlugin([30, 55, 80]), makeEndDotPlugin()]
  });
}

/* ---------- Temperature chart ---------- */
function drawTempChart(rows) {
  const labels = rows.map(r => r.time.slice(0,5));
  const temp   = rows.map(r => r.temp);
  const targetT= rows.map(() => targetTemp);

  if (chartTemp) chartTemp.destroy();

  chartTemp = new Chart(document.getElementById("chartTemp"), {
    type: "line",
    data: { labels, datasets: [
      { label: "Temperature", data: temp, borderColor: YELLOW,
        backgroundColor: "rgba(245,179,1,0.12)", fill: true, tension: 0.35,
        pointRadius: 0, borderWidth: 2.5 },
      { label: "Target", data: targetT, borderColor: YELLOW,
        pointRadius: 0, borderWidth: 1.4, borderDash: [5, 4], opacity: 0.5 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 18, right: 8, left: 0, bottom: 0 } },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: "#000", borderColor: YELLOW, borderWidth: 1,
          titleColor: YELLOW, bodyColor: YELLOW } },
      scales: {
        x: { grid: { display: false }, border: { color: "#3a2c00" },
          ticks: { color: YELLOW, maxTicksLimit: 4, font: { size: 9 } } },
        y: { min: 15, max: 40, grid: { display: false }, border: { display: false },
          ticks: { color: YELLOW, stepSize: 5, callback: v => v + "°", font: { size: 9 } } }
      }
    },
    plugins: [makeGridPlugin([20, 25, 30, 35]), makeEndDotPlugin()]
  });
}

/* ---------- Power chart ---------- */
function drawPowerChart(rows) {
  const labels = rows.map(r => r.time.slice(0,5));
  const power  = rows.map(r =>
    (r.humState === "ON" ? PWR_HUMIDIFIER : 0) +
    (r.fanState === "ON" ? PWR_FAN : 0) + PWR_ESP32);

  if (chartPower) chartPower.destroy();

  chartPower = new Chart(document.getElementById("chartPower"), {
    type: "line",
    data: { labels, datasets: [
      { label: "Power", data: power, borderColor: YELLOW,
        backgroundColor: "rgba(245,179,1,0.12)", fill: true,
        pointRadius: 0, borderWidth: 1.5, stepped: true }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 18, right: 8, left: 0, bottom: 0 } },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: "#000", borderColor: YELLOW, borderWidth: 1,
          titleColor: YELLOW, bodyColor: YELLOW } },
      scales: {
        x: { grid: { display: false }, border: { color: "#3a2c00" },
          ticks: { color: YELLOW, maxTicksLimit: 4, font: { size: 9 } } },
        y: { min: 0, max: 400, grid: { display: false }, border: { display: false },
          ticks: { color: YELLOW, stepSize: 100, callback: v => v + "W", font: { size: 9 } } }
      }
    }
  });
}

/* ---------- Tabs ---------- */
document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab"); if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentDay = +btn.dataset.day;
  render();
});

/* ---------- Save ---------- */
function saveTarget() {
  targetHumidity = +document.getElementById("inTarget").value;
  humidityBand   = +document.getElementById("inBand").value;
  fanOnHumidity  = +document.getElementById("inFan").value;
  targetTemp     = +document.getElementById("inTargetTemp").value;
  tempBand       = +document.getElementById("inTempBand").value;
  coolerOnTemp   = +document.getElementById("inCooler").value;

  DEMO_DATA[0] = generateDayData(0, targetHumidity, targetTemp);

  const msg = document.getElementById("saveMsg");
  msg.textContent = `✅ Saved: ${targetHumidity}% · ${targetTemp}°C`;
  setTimeout(() => { msg.textContent = ""; }, 3000);
  render();
}

/* ---------- Live tick ---------- */
setInterval(() => {
  const rows = DEMO_DATA[0];
  const now = new Date();
  const hour = now.getHours() + now.getMinutes() / 60;

  const hum = targetHumidity + 6 * Math.sin(hour / 3) + (Math.random() - 0.5) * 2;
  const temp = targetTemp + 4 * Math.sin((hour - 6) / 4) + (Math.random() - 0.5) * 0.8;

  rows.push({
    date: now.toISOString().slice(0,10),
    time: now.toTimeString().slice(0,8),
    temp: +temp.toFixed(1),
    hum: +hum.toFixed(1),
    target: targetHumidity,
    targetTemp,
    humState: hum < targetHumidity - 2 ? "ON" : "OFF",
    fanState: (hum > fanOnHumidity || temp > coolerOnTemp) ? "ON" : "OFF"
  });

  if (currentDay === 0) render();
}, 2000);

render();
</script>
</body>
</html>
