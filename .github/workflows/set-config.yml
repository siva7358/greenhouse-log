name: Set Target Humidity

on:
  workflow_dispatch:
    inputs:
      target_humidity:
        description: "Target humidity (%)"
        required: true
        default: "52"
      humidity_band:
        description: "Tolerance ± (%)"
        required: true
        default: "2"
      fan_on_humidity:
        description: "Fan ON above (%)"
        required: true
        default: "70"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write config.json
        run: |
          cat > config.json <<EOF
          {
            "target_humidity": ${{ github.event.inputs.target_humidity }},
            "humidity_band": ${{ github.event.inputs.humidity_band }},
            "fan_on_humidity": ${{ github.event.inputs.fan_on_humidity }},
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit & push
        run: |
          git config user.name  "greenhouse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config.json
          git commit -m "Set target humidity to ${{ github.event.inputs.target_humidity }}%"
          git push
